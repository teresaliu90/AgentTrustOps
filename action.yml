name: AgentTrustOps release gate
description: Block an unsafe agent policy release with deterministic governed-action scenarios.
author: AgentTrustOps contributors
branding:
  icon: shield
  color: green
inputs:
  scenarios:
    description: Path to the deterministic scenario JSON file.
    required: true
  policy:
    description: Path to the policy JSON file being evaluated.
    required: true
  python-version:
    description: Python runtime used by the release gate.
    required: false
    default: "3.13"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install AgentTrustOps from this action revision
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Evaluate governed-action scenarios
      shell: bash
      run: agenttrust eval "${{ inputs.scenarios }}" --policy "${{ inputs.policy }}"
