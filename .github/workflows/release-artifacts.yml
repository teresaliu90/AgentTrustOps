name: release-artifacts

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  python-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build cyclonedx-bom
      - run: python -m build
      - run: python -m venv release-environment
      - run: release-environment/bin/pip install dist/*.whl
      - name: Generate CycloneDX SBOM
        run: >-
          cyclonedx-py environment
          --output-format JSON
          --output-file dist/agenttrustops-${{ github.ref_name }}.cdx.json
          release-environment/bin/python
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: agenttrustops-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub Release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "AgentTrustOps ${{ github.ref_name }}"
          fi

  container-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Normalize the GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          sbom: true
          provenance: mode=max
