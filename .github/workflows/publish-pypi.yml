name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish after the matching GitHub Release passes.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - name: Match requested and source versions
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: >-
          python -c "import os,tomllib;
          actual=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert actual == os.environ['EXPECTED_VERSION'], (actual, os.environ['EXPECTED_VERSION'])"
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ steps.publish.outputs.package-url }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        id: publish
        uses: pypa/gh-action-pypi-publish@release/v1
