name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api,postgres,oidc,openai,mcp,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/agenttrustops
      - run: python -m unittest discover -s tests -v
      - name: SQLite benchmark integrity smoke test
        run: python benchmarks/benchmark_sqlite.py --iterations 25 --output benchmark.json
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.13'
        with:
          name: sqlite-benchmark-smoke
          path: benchmark.json
      - run: agenttrust eval examples/refund_ops/scenarios.json --policy examples/refund_ops/policy-safe.json
      - name: Prove unsafe release is blocked
        run: |
          if agenttrust eval examples/refund_ops/scenarios.json --policy examples/refund_ops/policy-unsafe.json; then
            echo "unsafe release unexpectedly passed"
            exit 1
          fi

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: agenttrustops_test
          POSTGRES_USER: agenttrustops
          POSTGRES_PASSWORD: contract-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenttrustops -d agenttrustops_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AGENTTRUSTOPS_TEST_POSTGRES_DSN: postgresql://agenttrustops:contract-test-only@127.0.0.1:5432/agenttrustops_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[postgres,dev]'
      - run: python -m unittest tests.test_postgres_contract -v

  opa-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Start a pinned OPA server with the example policy
        run: >-
          docker run --detach --rm --name agenttrustops-opa
          --publish 8181:8181
          --volume "${{ github.workspace }}/examples/opa:/policies:ro"
          openpolicyagent/opa:1.17.0-static
          run --server --addr=0.0.0.0:8181 /policies/agenttrustops.rego
      - name: Wait for OPA readiness
        run: curl --fail --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:8181/health
      - run: python -m pip install -e .
      - name: Exercise allow, approval, and deny over the real OPA Data API
        env:
          AGENTTRUSTOPS_TEST_OPA_URL: http://127.0.0.1:8181
        run: python -m unittest tests.test_opa_live -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/wheel-smoke
      - run: /tmp/wheel-smoke/bin/pip install dist/*.whl
      - run: /tmp/wheel-smoke/bin/python -c "import agenttrustops; assert agenttrustops.__version__ == '0.2.0'"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e '.[api,postgres,oidc]'
      - run: pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag agenttrustops:ci .
      - run: docker run --rm agenttrustops:ci --help

  reusable-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run AgentTrustOps as a local composite action
        uses: ./
        with:
          scenarios: examples/refund_ops/scenarios.json
          policy: examples/refund_ops/policy-safe.json
